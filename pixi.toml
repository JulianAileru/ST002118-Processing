[workspace]
authors = ["Julian Aileru <jaileru@unc.edu>"]
channels = ["conda-forge"]
name = "ST002118-Processing"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
r-base = ">=4.5.3,<4.6"
rpy2 = ">=3.6.9,<4"
ipykernel = ">=7.4.0,<8"
scipy = ">=1.18.1,<2"
numpy = ">=2.5.5,<3"
pandas = ">=3.1.1,<4"
nbformat = ">=5.11.1,<6"

[pypi-dependencies]
metabolomics-toolkit = { path = "repos/metabolomics-toolkit", editable = true }
serrf-py = { path = "repos/serrf-py", editable = true }
